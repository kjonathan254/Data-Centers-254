name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Phase 1: weekly full validation sweep so verification is continuous,
  # not just event-driven. Monday 06:17 UTC (09:17 EAT); odd minute to
  # avoid the top-of-hour Actions queue crunch.
  schedule:
    - cron: "17 6 * * 1"
  # Manual trigger from the Actions tab (e.g. before a release or report).
  workflow_dispatch:

jobs:
  content:
    name: Content validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate article frontmatter and content
        run: python3 scripts/article_validator.py

  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Dependency audit (report-only)
        run: npm audit --omit=dev --audit-level=high || true
