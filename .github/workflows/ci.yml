name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Phase 1: weekly full validation sweep so verification is continuous,
  # not just event-driven. Monday 06:17 UTC (09:17 EAT); odd minute to
  # avoid the top-of-hour Actions queue crunch.
  schedule:
    - cron: "17 6 * * 1"
  # Manual trigger from the Actions tab (e.g. before a release or report).
  workflow_dispatch:

jobs:
  content:
    name: Content validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate article frontmatter and content
        run: python3 scripts/article_validator.py

      - name: Dataset integrity gate (tech-audit 2026-10-23)
        run: python3 scripts/validate_dataset.py

  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Audit O02 (2026-10-15): the 13 trust-boundary smoke tests existed but
      # CI never ran them — a regression in subscribe-tokens, the rate limiter
      # or safeJsonLd could ship green. Failed tests now fail the build job.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Release gate (tech-audit 2026-10-23): high/critical findings in
      # production dependencies now block the build. Prod deps were brought
      # to 0 findings (next 16.4.3, GHSA-2464-fhr4-w9xw set fixed) before
      # this was made blocking; keep it green by patching within semver
      # rather than re-adding '|| true'.
      - name: Dependency audit (release gate)
        run: npm audit --omit=dev --audit-level=high
