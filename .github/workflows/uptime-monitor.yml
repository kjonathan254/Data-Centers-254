# External uptime + degradation monitor for DC254 production.
#
# Audit O03 (2026-10-15): /api/health existed but nothing watched it — an
# outage was only detectable when a visitor complained. This workflow pings
# production every 10 minutes; a failing run emails the repository owner
# (GitHub's default notification for failed scheduled runs), which is the
# alerting channel with zero extra accounts or credentials.
#
# All probe logic lives in scripts/uptime_probe.py (kept out of YAML so the
# assertions are testable locally with plain `python3 scripts/uptime_probe.py`).
# It checks the /api/health contract: ok:true, rateLimiting == "persistent",
# emailStack.subscribeSecret == true, and redis.reachable != false (P0-6).
#
# Transient blips don't page anyone: two attempts, 15s apart, inside the script.

name: Uptime monitor

on:
  schedule:
    # Every 10 minutes, offset from the top of the hour like CI.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Production health probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe production health
        run: python3 scripts/uptime_probe.py
